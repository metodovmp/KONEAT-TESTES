<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            position: relative;
        }

        /* Cabeçalho Limpo com Borda Transparente */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid transparent;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-chat {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .user-titles {
            display: flex;
            flex-direction: column;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-name-title {
            font-size: 15px;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.3px;
        }

        .status-sub {
            font-size: 12px;
            color: #8e8e93;
        }

        .header-actions-chat {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #000000;
        }

        .icon-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            text-decoration: none;
        }

        /* Área de Mensagens */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .empty-chat-msg {
            color: #8e8e93;
            font-size: 15px;
            text-align: center;
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 80%;
            margin-bottom: 12px;
            width: 100%;
        }

        .message-row.incoming {
            align-self: flex-start;
        }

        .message-row.outgoing {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar-msg {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            flex-shrink: 0;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .incoming .bubble {
            background: #f0f0f2;
            color: #000000;
            border-bottom-left-radius: 4px;
        }

        .outgoing .bubble {
            background: #6c5ce7;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        /* Rodapé / Barra de Entrada Idêntica ao Instagram */
        .chat-input-bar {
            padding: 10px 16px 20px 16px;
            background: #ffffff;
            display: flex;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #efefef; /* Tom cinza suave padrão Instagram */
            border-radius: 24px;
            padding: 8px 14px;
            gap: 12px;
        }

        .btn-input-icon {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
        }

        .message-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: #000000;
        }

        .message-input::placeholder {
            color: #8e8e93;
        }

        .input-actions-right {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #000000;
        }
    </style>
</head>
<body class="light-theme">

    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <a href="./mensagens.html" class="icon-action-btn" aria-label="Voltar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </a>
                <div class="user-info-header">
                    <div class="avatar-chat">K</div>
                    <div class="user-titles">
                        <div class="name-row">
                            <span class="user-name-title">KONEAT</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="#0095f6"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                        </div>
                        <span class="status-sub">Online há 2 h</span>
                    </div>
                </div>
            </div>

            <div class="header-actions-chat">
                <button class="icon-action-btn" aria-label="Chamada de Voz">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </button>
                <button class="icon-action-btn" aria-label="Chamada de Vídeo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                </button>
                <button class="icon-action-btn" aria-label="Informações">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </button>
            </div>
        </header>

        <!-- Área de Conversa -->
        <main class="chat-messages" id="chatMessages">
            <div class="empty-chat-msg">Suas mensagens aparecerão aqui.</div>
        </main>

        <!-- Rodapé Estilo Instagram (Pílula com Câmera e SVGs Direita) -->
        <div class="chat-input-bar">
            <div class="input-wrapper">
                <!-- Ícone de Câmera à Esquerda -->
                <button class="btn-input-icon" aria-label="Câmera">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </button>
                
                <!-- Campo de Texto -->
                <input type="text" class="message-input" placeholder="Mensagem...">
                
                <!-- Ícones à Direita (Enviar, Microfone, Galeria) -->
                <div class="input-actions-right">
                    <button class="btn-input-icon" aria-label="Enviar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                    <button class="btn-input-icon" aria-label="Áudio">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <button class="btn-input-icon" aria-label="Galeria">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
