<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: #ffffff;
        }
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 62px;
            background: #121214;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            box-sizing: border-box;
            padding: 0 10px;
        }
        .nav-link {
            background: none;
            border: none;
            cursor: pointer;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 48px;
            height: 48px;
        }
        .profile-active-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .profile-active-circle svg { stroke: #fff; }
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px 0 80px 0;
            width: 100%;
        }
        .post-grid-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #222222;
            overflow: hidden;
            cursor: pointer;
        }
        .post-grid-item img, .post-grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-grid-item .badge-video {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            padding: 3px;
            border-radius: 4px;
            display: flex;
            z-index: 2;
        }
        .btn-delete-post {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        .btn-delete-post:hover { background: rgba(231, 76, 60, 0.9); }
    </style>
</head>
<body class="light-theme">

<div class="app-container" style="padding-bottom: 70px;">
    <header class="profile-header">
        <div class="header-logo" id="headerUsername" style="text-transform: lowercase; font-size: 20px; font-weight: 700; letter-spacing: -0.5px;">koneat_user</div>
        <div class="header-actions">
            <a href="./mensagens.html" class="icon-btn" aria-label="Mensagens" style="position: relative; width: 22px; height: 16px; background: #8e8e93; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                <div style="display: flex; gap: 1.5px;">
                    <span style="width: 2.5px; height: 2.5px; background: #fff; border-radius: 50%;"></span>
                    <span style="width: 2.5px; height: 2.5px; background: #fff; border-radius: 50%;"></span>
                    <span style="width: 2.5px; height: 2.5px; background: #fff; border-radius: 50%;"></span>
                </div>
                <div style="position: absolute; bottom: -3px; right: 3px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #8e8e93; transform: rotate(-25deg);"></div>
            </a>
            <div class="dropdown-wrapper">
                <button class="icon-btn" id="menuBtn" aria-label="Opções">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="./configuracoes.html" class="dropdown-item">Configurações</a>
                    <a href="./privacidade.html" class="dropdown-item">Privacidade</a>
                    <a href="./termos.html" class="dropdown-item">Termos</a>
                </div>
            </div>
        </div>
    </header>

    <section class="profile-top-layout">
        <div class="avatar-container">
            <div class="avatar-circle">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <button class="camera-btn" aria-label="Alterar Foto">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </button>
        </div>
        <div class="stats-bar-inline">
            <div class="stat-item">
                <span class="stat-number" id="postsCount">0</span>
                <span class="stat-label">posts</span>
            </div>
            <a href="./seguidores.html" class="stat-item" style="text-decoration: none; cursor: pointer;">
                <span class="stat-number">0</span>
                <span class="stat-label">seguidores</span>
            </a>
            <a href="./seguindo.html" class="stat-item" style="text-decoration: none; cursor: pointer;">
                <span class="stat-number">0</span>
                <span class="stat-label">seguindo</span>
            </a>
        </div>
    </section>

    <section class="user-details-block">
        <h1 class="user-name" id="profileName">Koneat User</h1>
        <p class="user-tag" id="profileTag">@koneat_user</p>
        <p class="user-bio" id="profileBio"></p>
    </section>

    <section class="action-buttons" style="display: flex; gap: 8px; padding: 12px 16px 0 16px;">
        <a href="./editar-perfil.html" class="btn-secondary" style="flex: 1; height: 32px; background: #efefef; border: none; border-radius: 8px; color: #000; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Editar perfil</a>
        <button type="button" class="btn-secondary" onclick="shareProfile()" style="flex: 1; height: 32px; background: #efefef; border: none; border-radius: 8px; color: #000; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer;">Compartilhar perfil</button>
    </section>

    <nav class="content-tabs">
        <button class="tab-btn active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Todos</span>
        </button>
        <button class="tab-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
            <span>Reposts</span>
        </button>
        <button class="tab-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                <circle cx="12" cy="10" r="3"></circle>
                <path d="M7 18c0-2.5 2.2-4.2 5-4.2s5 1.7 5 4.2"></path>
            </svg>
            <span>Marcações</span>
        </button>
    </nav>

    <!-- REFINO: só UM emptyState, sem duplicar id -->
    <section class="feed-empty-state" id="emptyState" style="padding: 30px 16px; text-align: center;">
        <div class="empty-icon-wrapper" style="margin: 0 auto 8px auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8.5" cy="8.5" r="3"></circle>
                <path d="M3.5 18c0-2.5 2.2-4 5-4s5 1.5 5 4"></path>
                <circle cx="15.5" cy="8.5" r="3"></circle>
                <path d="M15.5 14c2.8 0 5 1.5 5 4"></path>
            </svg>
        </div>
        <h2 class="empty-title" style="font-size: 13px; font-weight: 400; color: #8e8e93; margin: 0 0 12px 0;">Compartilhe seu primeiro momento com o koneat</h2>
        <button type="button" onclick="window.location.href='./passo3.html'" style="display: inline-block; background: #efefef; color: #000; padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer;">Crie seu primeiro post</button>
    </section>

    <div class="posts-grid" id="userPostsGrid" style="display:none;"></div>
</div>

<nav class="bottom-nav-fixed">
    <a href="./passo4.html" class="nav-link" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <a href="./passo3.html" class="nav-link" aria-label="Criar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5" stroke="#8e8e93" stroke-width="1.8" fill="none"></rect><path d="M12 7v10M7 12h10" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
    <a href="./passo2.html" class="nav-link" aria-label="Vídeos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="4"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
    </a>
    <a href="./passo1.html" class="nav-link" aria-label="Perfil">
        <div class="profile-active-circle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
    </a>
</nav>

<!-- REFINO: sem script inline duplicado, só o app.js que já tem initPasso1 -->
<script src="js/app.js"></script>
</body>
                    </html>
