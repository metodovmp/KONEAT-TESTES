<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Koneat - Criar publicação</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; margin: 0; background: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        button, a { font: inherit; }
        .create-header { width: 100%; height: 56px; display: flex; align-items: center; border-bottom: 1px solid #1f1f1f; position: relative; background: #000000; }
        .close-link { width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none; flex-shrink: 0; }
        .close-link svg { width: 24px; height: 24px; }
        .create-tabs { height: 100%; flex: 1; display: flex; align-items: stretch; justify-content: center; padding-right: 50px; }
        .create-tab { position: relative; min-width: 33.33%; height: 100%; border: 0; background: transparent; color: #8e8e93; font-size: 15px; font-weight: 600; cursor: pointer; }
        .create-tab.active { color: #ffffff; }
        .create-tab.active::after { content: ""; position: absolute; height: 2px; background: #ffffff; left: 0; right: 0; bottom: 0; }
        .gallery-toolbar { height: 56px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        .gallery-select { display: flex; align-items: center; gap: 8px; border: 0; padding: 0; background: transparent; color: #ffffff; font-size: 18px; font-weight: 600; cursor: pointer; }
        .gallery-select svg { width: 18px; height: 18px; }
        .toolbar-actions { display: flex; align-items: center; gap: 12px; }
        .round-tool { width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.1); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .round-tool svg { width: 20px; height: 20px; }
        input[type="file"] { display: none; }
        .media-area { position: absolute; top: 112px; left: 0; right: 0; bottom: 130px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #8e8e93; text-align: center; }
        .empty-state svg { width: 64px; height: 64px; }
        .empty-state p { margin: 0; font-size: 16px; font-weight: 500; }
        .media-preview { display: none; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
        .advance-button { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); width: auto; min-width: 160px; padding: 0 32px; height: 44px; border: 0; border-radius: 22px; background: #ffffff; color: #000000; font-size: 15px; font-weight: 600; cursor: pointer; z-index: 30; }
        .advance-button:disabled { opacity: .35; cursor: not-allowed; }
        .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; height: 62px; background: #121214; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; align-items: center; justify-content: space-around; z-index: 40; padding: 0 10px; }
        .nav-link { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #8e8e93; text-decoration: none; flex-shrink: 0; }
        .nav-link svg { width: 22px; height: 22px; }
        .nav-link.active .nav-box-bg { stroke: #ffffff; fill: none; }
        .nav-link.active .nav-icon-inner { stroke: #ffffff; fill: #ffffff; }
        .caption-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.95); z-index: 100; display: none; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .caption-modal.show { display: flex; }
        .caption-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .caption-header h2 { font-size: 18px; margin: 0; font-weight: 700; }
        .btn-back-caption, .btn-publish-final { background: none; border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
        .btn-publish-final { color: #00ff88; }
        .caption-body { display: flex; gap: 16px; align-items: flex-start; }
        .caption-thumbnail { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; background: #222; }
        .caption-textarea { flex: 1; height: 120px; background: transparent; border: none; color: #fff; font-size: 15px; resize: none; outline: none; font-family: inherit; }
        .caption-textarea::placeholder { color: #8e8e93; }
        .toast-plus { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(10px); background: #fff; color: #000; padding: 12px 18px; border-radius: 20px; font-size: 14px; font-weight: 700; z-index: 200; opacity: 0; pointer-events: none; transition: .25s; }
        .toast-plus.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <header class="create-header">
        <a href="./passo4.html" class="close-link" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </a>
        <nav class="create-tabs">
            <button class="create-tab active" data-type="post">POST</button>
            <button class="create-tab" data-type="story">STORY</button>
            <button class="create-tab" data-type="video">VÍDEO</button>
        </nav>
    </header>
    <section class="gallery-toolbar">
        <button class="gallery-select" id="openGallery">Galeria <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div class="toolbar-actions">
            <button class="round-tool" id="openGalleryIcon" aria-label="Abrir galeria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="15" height="15" rx="2"/><path d="M8 7h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg></button>
            <button class="round-tool" id="openCamera" aria-label="Abrir câmera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        </div>
    </section>
    <input type="file" id="galleryInput" accept="image/*,video/*">
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <main class="media-area">
        <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <p id="emptyText">Selecione uma mídia para publicar</p>
        </div>
        <img id="imagePreview" class="media-preview" alt="Prévia">
        <video id="videoPreview" class="media-preview" controls playsinline></video>
    </main>
    <button class="advance-button" id="advanceButton" disabled>Avançar</button>
    <div class="caption-modal" id="captionModal">
        <div class="caption-header"><button type="button" class="btn-back-caption" id="closeModalBtn">Voltar</button><h2>Nova publicação</h2><button type="button" class="btn-publish-final" id="publishFinalBtn">Compartilhar</button></div>
        <div class="caption-body"><img id="modalThumbnail" class="caption-thumbnail" src="" alt="Thumbnail"><textarea id="postCaptionInput" class="caption-textarea" placeholder="Escreva uma legenda..."></textarea></div>
    </div>
    <nav class="bottom-nav">
        <a href="./passo4.html" class="nav-link" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
        <a href="./passo3.html" class="nav-link active" aria-label="Criar"><svg viewBox="0 0 24 24"><rect class="nav-box-bg" x="2" y="2" width="20" height="20" rx="5" stroke="#ffffff" stroke-width="2" fill="none"></rect><path class="nav-icon-inner" d="M12 7v10M7 12h10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg></a>
        <a href="./passo2.html" class="nav-link" aria-label="Vídeos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><polygon points="10,8 16,12 10,16"/></svg></a>
        <a href="./passo1.html" class="nav-link" aria-label="Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
    </nav>
    <div class="toast-plus" id="toastPlus"></div>
    <script>
        const galleryInput = document.getElementById("galleryInput");
        const cameraInput = document.getElementById("cameraInput");
        const emptyState = document.getElementById("emptyState");
        const emptyText = document.getElementById("emptyText");
        const imagePreview = document.getElementById("imagePreview");
        const videoPreview = document.getElementById("videoPreview");
        const advanceButton = document.getElementById("advanceButton");
        const captionModal = document.getElementById("captionModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const publishFinalBtn = document.getElementById("publishFinalBtn");
        const modalThumbnail = document.getElementById("modalThumbnail");
        const postCaptionInput = document.getElementById("postCaptionInput");
        function showToast(msg){ const t=document.getElementById('toastPlus'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
        function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('koneat_db',1); r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('media')) r.result.createObjectStore('media'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
        function saveMedia(id,file){ return openDB().then(db=> new Promise((res,rej)=>{ const tx=db.transaction('media','readwrite'); tx.objectStore('media').put(file,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
        let selectedFile = null;
        let currentMediaUrl = null;
        let selectedType = 'post';
        let selectedFormato = '1:1';
        let selectedDur = 0;
        let selectedCapa = '';
        let isPublishing = false;
        const userId = localStorage.getItem('koneat_userId') || 'user_'+Date.now();
        localStorage.setItem('koneat_userId', userId);
        const username = localStorage.getItem('koneat_username') || 'koneat_user';
        document.getElementById("openGallery").addEventListener("click", () => galleryInput.click());
        document.getElementById("openGalleryIcon").addEventListener("click", () => galleryInput.click());
        document.getElementById("openCamera").addEventListener("click", () => cameraInput.click());
        function getFormato(file, cb){
          if(file.type.startsWith('image')){
            const img=new Image(); img.onload=()=>{ let r=img.width/img.height; cb(r>1.6?'16:9':r>1.1?'4:3':r>0.9?'1:1':'4:5'); }; img.src=URL.createObjectURL(file);
          } else {
            const v=document.createElement('video'); v.onloadedmetadata=()=>{ let r=v.videoWidth/v.videoHeight; cb(r>1.6?'16:9':r>1.1?'4:3':r>0.9?'1:1':'4:5'); }; v.src=URL.createObjectURL(file);
          }
        }
        function getDuracao(file){
          return new Promise((res)=>{
            if(file.type.startsWith('image')) return res(0);
            const v=document.createElement('video'); v.preload='metadata';
            v.onloadedmetadata=()=>{ URL.revokeObjectURL(v.src); res(v.duration||0); };
            v.onerror=()=>res(0); v.src=URL.createObjectURL(file);
          });
        }
        function gerarCapaVideo(file){
          return new Promise((res)=>{
            let done=false; const finish=(val)=>{ if(!done){ done=true; res(val); } };
            const v=document.createElement('video'); v.muted=true; v.preload='auto';
            v.onloadeddata=()=>{ try{ v.currentTime=0.1; }catch(e){ finish(''); } };
            v.onseeked=()=>{ try{ const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); finish(c.toDataURL('image/jpeg',0.7)); }catch(e){ finish(''); } URL.revokeObjectURL(v.src); };
            v.onerror=()=>finish(''); v.src=URL.createObjectURL(file);
            setTimeout(()=>finish(''),1500);
          });
        }
        function validar(file, dur, aba){
          const mb=file.size/1024/1024;
          if(aba==='post'){
            if(file.type.startsWith('image')&&mb>10) return {ok:false,msg:'POST até 10MB'};
            if(file.type.startsWith('video')){
              if(mb>100) return {ok:false,msg:'Somente vídeo Feed de até 3:00 minutos'};
              if(dur>185) return {ok:false,msg:'Somente vídeo Feed de até 3:00 minutos'};
            }
            return {ok:true};
          }
          if(aba==='video'){
            if(!file.type.startsWith('video')) return {ok:false,msg:'Escolha um vídeo para VÍDEO'};
            if(mb>100) return {ok:false,msg:'Somente vídeo Feed de até 3:00 minutos'};
            if(dur>185) return {ok:false,msg:'Somente vídeo Feed de até 3:00 minutos'};
            return {ok:true};
          }
          if(aba==='story'){
            if(file.type.startsWith('image')&&mb>10) return {ok:false,msg:'STORY até 10MB'};
            if(file.type.startsWith('video')&&dur>60) return {ok:false,msg:'STORY até 60s'};
            return {ok:true};
          }
          return {ok:true};
        }
        async function showSelectedMedia(file) {
            if (!file) return;
            const dur = await getDuracao(file);
            const v = validar(file, dur, selectedType);
            if(!v||!v.ok){ showToast(v.msg); galleryInput.value=''; cameraInput.value=''; return; }
            selectedFile = file;
            selectedDur = dur;
            getFormato(file, (f)=>{ selectedFormato=f; });
            if(file.type.startsWith('video')) selectedCapa = await gerarCapaVideo(file);
            if (currentMediaUrl) URL.revokeObjectURL(currentMediaUrl);
            currentMediaUrl = URL.createObjectURL(file);
            emptyState.style.display = "none";
            imagePreview.style.display = "none";
            videoPreview.style.display = "none";
            if (file.type.startsWith("video/")) {
                imagePreview.removeAttribute("src");
                videoPreview.src = currentMediaUrl;
                videoPreview.style.display = "block";
                modalThumbnail.src = selectedCapa || '';
            } else {
                videoPreview.pause();
                videoPreview.removeAttribute("src");
                imagePreview.src = currentMediaUrl;
                imagePreview.style.display = "block";
                modalThumbnail.src = currentMediaUrl;
            }
            advanceButton.disabled = false;
        }
        galleryInput.addEventListener("change", e => showSelectedMedia(e.target.files[0]));
        cameraInput.addEventListener("change", e => showSelectedMedia(e.target.files[0]));
        document.querySelectorAll(".create-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".create-tab").forEach(item => item.classList.remove("active"));
                tab.classList.add("active");
                selectedType = tab.dataset.type;
                if(selectedType==='post') emptyText.textContent='Selecione uma mídia para publicar';
                if(selectedType==='story') emptyText.textContent='Selecione uma foto ou vídeo para o Story (até 1 min)';
                if(selectedType==='video') emptyText.textContent='Selecione um vídeo (até 3 min)';
            });
        });
        advanceButton.addEventListener("click", () => {
            if (!selectedFile) { galleryInput.click(); return; }
            captionModal.classList.add('show');
        });
        closeModalBtn.addEventListener("click", ()=> captionModal.classList.remove('show'));
        function resetPlus(){
          captionModal.classList.remove('show');
          postCaptionInput.value = '';
          galleryInput.value = '';
          cameraInput.value = '';
          selectedFile = null;
          selectedCapa = '';
          advanceButton.disabled = true;
          imagePreview.style.display = 'none';
          videoPreview.style.display = 'none';
          videoPreview.pause();
          emptyState.style.display = 'flex';
        }
        publishFinalBtn.addEventListener("click", async ()=>{
            if(!selectedFile || isPublishing) return;
            isPublishing = true;
            const v = validar(selectedFile, selectedDur, selectedType);
            if(!v||!v.ok){ showToast(v.msg); isPublishing=false; return; }
            try{
              const now = Date.now();
              const isStory = selectedType==='story';
              const mediaId = 'media_'+now;
              await saveMedia(mediaId, selectedFile);
              const novo = {
                id: now,
                mediaId: mediaId,
                tipo: isStory ? 'STORY' : 'FEED',
                type: isStory ? 'story' : 'home',
                subTipo: selectedType,
                origem: 'plus',
                midia: '',
                url: '',
                mediaType: selectedFile.type.startsWith('video') ? 'video' : 'image',
                capa: selectedCapa || '',
                formato: selectedFormato || '1:1',
                legenda: postCaptionInput.value || '',
                caption: postCaptionInput.value || '',
                data: now,
                createdAt: now,
                expiresAt: isStory ? now + 24*60*60*1000 : null,
                author: username,
                userId: userId,
                reacoes: { likes: 0, comentarios: [] }
              };
              if(isStory){
                let s = JSON.parse(localStorage.getItem('koneat_stories')||'[]');
                s.unshift(novo);
                localStorage.setItem('koneat_stories', JSON.stringify(s));
                isPublishing = false;
                showToast('Story publicado! Vai aparecer na Home por 24h.');
                resetPlus();
                return;
              } else {
                let todos = JSON.parse(localStorage.getItem('koneat_posts')||'[]');
                todos.unshift(novo);
                localStorage.setItem('koneat_posts', JSON.stringify(todos));
                window.location.href = "./passo4.html";
              }
            }catch(e){
              isPublishing = false;
              showToast('Não deu pra salvar esse arquivo. Tenta um menor.');
            }
        });
    </script>
    <script src="js/app.js"></script>
</body>
</html>
